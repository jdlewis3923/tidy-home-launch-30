<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16233f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b2a55"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd75e"/>
      <stop offset="100%" stop-color="#e0a806"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5aa8ff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- navy squircle field -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#navy)"/>

  <!-- soft sweep -->
  <path d="M0 372 C150 300 330 356 512 250 L512 512 L0 512 Z" fill="#2563eb" opacity="0.16"/>
  <path d="M0 428 C170 372 340 420 512 336 L512 512 L0 512 Z" fill="#5aa8ff" opacity="0.10"/>

  <!-- shield / badge -->
  <path d="M256 84 L392 130 V266 c0 84 -60 138 -136 166 -76 -28 -136 -82 -136 -166 V130 Z"
        fill="url(#sky)" opacity="0.16"/>
  <path d="M256 84 L392 130 V266 c0 84 -60 138 -136 166 -76 -28 -136 -82 -136 -166 V130 Z"
        fill="none" stroke="url(#gold)" stroke-width="10"/>

  <!-- T lettermark -->
  <path d="M176 176 h160 v44 h-56 v148 h-48 V220 h-56 Z" fill="#ffffff"/>

  <!-- gold PRO bar -->
  <rect x="186" y="392" width="140" height="34" rx="17" fill="url(#gold)"/>
  <text x="256" y="416" text-anchor="middle" font-family="Poppins, Archivo, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="800" letter-spacing="4" fill="#0f172a">PRO</text>

  <!-- sparkle -->
  <path d="M382 108 l9 26 26 9 -26 9 -9 26 -9 -26 -26 -9 26 -9 Z" fill="#ffffff" opacity="0.9"/>
</svg>
