    <!--
      Head ownership: react-helmet-async owns <title>, description, canonical and
      all og/twitter tags. NOTHING route-specific may be hardcoded here — a
      pre-rendered homepage head in this file wins over Helmet on every other
      route (this broke /apply, /bundle, /help and /terms). The bare title below
      is only a pre-hydration placeholder.
    -->
    <title>Tidy Home Concierge</title>
    <meta name="author" content="Tidy Home Concierge LLC" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
    />

      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove Lovable badge from DOM
      (function() {
        function removeBadge() {
          document.querySelectorAll('#lovable-badge, a[href*="lovable.dev"], [data-lovable]').forEach(function(el) {
            el.remove();
          });
        }
        removeBadge();
        var observer = new MutationObserver(function(mutations) {
          removeBadge();
        });
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
